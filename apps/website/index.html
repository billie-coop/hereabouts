<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('billie-coop-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {
          // Dark remains the default when browser storage is unavailable.
        }
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.classList.toggle('dark', theme === 'dark');
        root.style.colorScheme = theme;
      })();
    </script>
    <title>hereabouts · Internationalization</title>
    <meta
      name="description"
      content="Locale-aware number, currency, date, unit and message formatting with exact decimal math, built on CLDR data."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
