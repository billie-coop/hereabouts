name: Release

# Publishes @billie-coop/hereabouts at the version committed in
# packages/hereabouts/package.json. Bump it in a PR first, merge to main, then
# run this workflow by hand. It never runs on its own.
#
# The resource packs are built from that version: their checksum covers its
# major.minor, so the packs and the library are always published together.
#
# Authenticates via npm trusted publishing (OIDC), no NPM_TOKEN. The trusted
# publisher on npmjs.com must be: owner billie-coop, repo hereabouts, workflow
# release.yml.

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (npm publish --dry-run, no GitHub release)'
        required: false
        type: boolean
        default: true

env:
  PACKAGE_DIR: packages/hereabouts
  PACKAGE_NAME: '@billie-coop/hereabouts'

jobs:
  release:
    name: Publish to npm & create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release must run from main (got ${{ github.ref }})"
          exit 1

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup toolchain with Proto
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Get yarn cache directory
        id: yarn-config
        run: echo "CACHE_FOLDER=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'

      - name: Restore yarn cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-config.outputs.CACHE_FOLDER }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'

      - name: Read version
        id: version
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          # Prereleases (2.1.0-beta.1) go to 'next'; stable versions to 'latest'
          if [[ "$VERSION" == *-* ]]; then
            echo "dist-tag=next" >> $GITHUB_OUTPUT
          else
            echo "dist-tag=latest" >> $GITHUB_OUTPUT
          fi
          echo "Releasing $PACKAGE_NAME@$VERSION"

      - name: Ensure version is unreleased
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists. Bump $PACKAGE_DIR/package.json first"
            exit 1
          fi
          if npm view "$PACKAGE_NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$PACKAGE_NAME@$VERSION is already on npm. Bump $PACKAGE_DIR/package.json first"
            exit 1
          fi

      # The build comes first: tests and the API reports read the built output
      # and the resource packs.
      - name: Build
        run: yarn build

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: API reports
        run: yarn api

      # Node 24 ships npm 11, which trusted publishing (OIDC) requires.
      - name: Setup Node.js for publishing
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # devDependencies use yarn's workspace: protocol, which npm can't parse
      # and which must never reach the registry. The runtime dependencies
      # (tslib) are plain semver ranges.
      - name: Strip devDependencies
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          npm --version
          npm pkg delete devDependencies
          if grep -q 'workspace:' package.json; then
            echo "::error::workspace: protocol still present in package.json"
            exit 1
          fi

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry-run }}
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm publish --dry-run --access public --tag "${{ steps.version.outputs.dist-tag }}"

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist-tag }}"

      - name: Create GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: |
          PRERELEASE=""
          if [[ "$DIST_TAG" == "next" ]]; then PRERELEASE="--prerelease"; fi
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
            --target "${{ github.sha }}" $PRERELEASE
