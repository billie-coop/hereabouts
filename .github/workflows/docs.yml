name: Deploy docs

# Builds the example site (apps/website) and deploys it to GitHub Pages at
# https://billie-coop.github.io/hereabouts/.

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let in-progress deploys finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup toolchain with Proto
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Get yarn cache directory
        id: yarn-config
        run: echo "CACHE_FOLDER=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'

      - name: Restore yarn cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.yarn-config.outputs.CACHE_FOLDER }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_GLOBAL_CACHE: 'false'

      # Builds the library and the resource packs the site loads, then the site
      # itself (relative base by default; pinned to the Pages path here).
      - name: Build library and packs
        run: yarn build

      - name: Build site
        run: yarn workspace website build --base /hereabouts/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
